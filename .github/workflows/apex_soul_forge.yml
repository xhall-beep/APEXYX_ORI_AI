name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autonomic Hardening & Version Lock
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget python3-pip zlib1g-dev autoconf libtool pkg-config cmake
          # Lock versions to prevent recipe conflicts
          pip install --upgrade pip
          pip install "Cython<3.0" wheel "setuptools<70.0.0" buildozer

      - name: Recursive Sovereign Build
        run: |
          # Protocol: Auto-Accept Licenses and Force-Inject Specs
          export PATH=$PATH:~/.local/bin/
          
          build_logic() {
            echo "::group::Executing Sovereign Strategy"
            if [ ! -f buildozer.spec ]; then buildozer init; fi
            # Injecting optimized parameters directly into the spec
            sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
            sed -i 's/android.arch = .*/android.arch = armeabi-v7a/' buildozer.spec
            # The License Hammer
            yes | buildozer -v android debug
          }

          # Autonomic Retry Logic: Attempt -> Clobber -> Retry
          build_logic || (echo "Strategy 1 Failed. Purging cache and retrying..." && buildozer clobber && build_logic)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
