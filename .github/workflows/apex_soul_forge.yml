name: Apexyx Soul Forge FINAL-STRIKE
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget zlib1g-dev autoconf libtool pkg-config cmake libstdc++6 lld
      - name: Install Build Tools
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "Cython==0.29.33" virtualenv
      - name: Forge APK
        run: |
          # Bypassing the interactive prompt properly
          buildozer android debug
      - name: Upload Sovereign APK
        uses: actions/upload-artifact@v4
        with:
          name: Apexyx-Sovereign-FINAL
          path: bin/*.apk
