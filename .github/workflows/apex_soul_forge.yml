name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hardened Environment (v9)
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list
          sudo apt-get update || true
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget python3-pip zlib1g-dev autoconf libtool pkg-config cmake aidl libstdc++6 || true
          pip install --upgrade pip
          pip install "Cython<3.0" wheel "setuptools<70.0.0" buildozer

      - name: Sovereign NDK & License Injection
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          # Force the internal spec to accept licenses
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.arch = .*/android.arch = armeabi-v7a/' buildozer.spec
          
          # MANUAL LICENSE INJECTION: Creating the magic hashes the SDK looks for
          mkdir -p ~/.android/
          touch ~/.android/repositories.cfg
          # This hash represents the accepted license for the Android SDK
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56263074850734107e3226a27521746f3945412\n24333f8a63b682569cd48292700318359048a946" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Recursive Autonomic Build
        run: |
          export PATH=$PATH:~/.local/bin/
          # Strategy: Use the --profile flag to separate the log and prevent terminal flooding
          buildozer -v android debug || (echo "STRIKE FAILED. DUMPING INTERNAL LOG..." && find .buildozer -name "build.log" -exec tail -n 200 {} + && exit 1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
