name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System Hardening & SDK Injection
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget python3-pip zlib1g-dev autoconf libtool pkg-config cmake aidl libstdc++6
          pip install "Cython<3.0" wheel "setuptools<70.0.0" buildozer==1.5.0
          
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          # Set Environments
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          # Force Accept Licenses and Pre-install required components
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.0"
          
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools" >> $GITHUB_ENV

      - name: Sovereign Spec Injection
        run: |
          cat << 'EOT' > buildozer.spec
          [app]
          title = Apexyx Soul
          package.name = apexyx_soul
          package.domain = org.montgomery
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,js,so,dex,conf,bin,sh
          source.include_patterns = mobile-deploy/*,src/*,src/handlers/*
          version = 0.1
          requirements = python3,kivy==2.3.0
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.arch = armeabi-v7a
          android.accept_sdk_license = True
          android.sdk_path = /home/runner/android-sdk
          p4a.branch = master
          [buildozer]
          log_level = 2
          EOT

      - name: Final Sovereign Strike
        run: |
          export PATH=$PATH:~/.local/bin/
          # The "yes" pipe is the hammer that breaks the hang
          yes | buildozer -v android debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Sovereign APK
        uses: actions/upload-artifact@v4
        with:
          name: Apexyx-Sovereign-APK
          path: bin/*.apk
