name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hardened Environment (v10)
        run: |
          sudo apt-get update || true
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget python3-pip zlib1g-dev autoconf libtool pkg-config cmake aidl libstdc++6 || true
          pip install --upgrade pip
          pip install "Cython<3.0" wheel "setuptools<70.0.0" buildozer

      - name: Path Alignment & License Fix
        run: |
          if [ ! -f buildozer.spec ]; then buildozer init; fi
          # Force the license agreement
          sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/android.arch = .*/android.arch = armeabi-v7a/' buildozer.spec
          
          # Fix the aidl path error (Common Buildozer bug on Ubuntu 22.04+)
          sudo ln -sf /usr/bin/aidl /usr/local/bin/aidl
          
          # Create license dir BEFORE buildozer attempts to download
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56263074850734107e3226a27521746f3945412\n24333f8a63b682569cd48292700318359048a946" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

      - name: Recursive Autonomic Build
        run: |
          export PATH=$PATH:~/.local/bin/
          # We use "debug" first to trigger the downloads, then auto-retry on failure
          yes | buildozer -v android debug || (echo "STRIKE 1 FAILED. CLEANING AND RE-TRYING PATHS..." && buildozer clobber && yes | buildozer -v android debug)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
