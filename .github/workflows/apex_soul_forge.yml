name: Apexyx Soul Forge v80-STRIKE
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget zlib1g-dev autoconf libtool pkg-config cmake libstdc++6 lld
      - name: Install Build Tools
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "Cython==0.29.33" virtualenv
      - name: Forge APK (Verbose)
        run: |
          # The --verbose flag will tell us EXACTLY why it failed
          # We force accept licenses to prevent hang-ups
          yes | buildozer --verbose android debug
      - name: Upload Sovereign APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apexyx-Sovereign-v80-Debug
          path: bin/*.apk
