name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: Sovereign Core Injection
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget python3-pip zlib1g-dev autoconf libtool pkg-config cmake aidl libstdc++6
          python3 -m pip install --user --upgrade "Cython<3.0" wheel "setuptools<70.0.0" buildozer==1.5.0
          
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$HOME/.local/bin
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-33" "build-tools;33.0.0"

      - name: Atomic Spec Injection (Absolute)
        run: |
          cat << 'EOT' > buildozer.spec
          [app]
          title = Apexyx Soul
          package.name = apexyx_soul
          package.domain = org.montgomery
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,js,so,dex,conf,sh,txt
          # Removed specific patterns to force it to see everything in root
          version = 0.1
          requirements = python3,kivy==2.3.0,requests,certifi
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.arch = armeabi-v7a
          android.accept_sdk_license = True
          android.sdk_path = /home/runner/android-sdk
          p4a.branch = master
          [buildozer]
          log_level = 2
          EOT

      - name: Final Sovereign Strike
        run: |
          export PATH=$PATH:$HOME/.local/bin
          # Verify file presence in the runner environment before strike
          ls -la
          if [ ! -f main.py ]; then echo "CRITICAL: main.py not found in root!"; exit 1; fi
          yes | buildozer android debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Sovereign APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Apexyx-Sovereign-APK
          path: bin/*.apk
