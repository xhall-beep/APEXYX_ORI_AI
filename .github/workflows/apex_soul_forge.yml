name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sovereign Core Setup
        run: |
          for i in {1..3}; do sudo apt-get update && break || sleep 15; done
          sudo apt-get install -y --no-install-recommends \
            build-essential libffi-dev libssl-dev python3-dev zip unzip \
            openjdk-17-jdk wget zlib1g-dev autoconf libtool pkg-config \
            cmake libstdc++6 libncurses5
          # Force specific versioning for Kivy 2.3.0 compatibility
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user --upgrade "buildozer==1.5.0" "Cython==0.29.33" "sh"
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Atomic Spec Injection
        run: |
          cat << 'EOT' > buildozer.spec
          [app]
          title = Apexyx Soul
          package.name = apexyx_soul
          package.domain = org.montgomery
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,js,so,dex,conf,sh,txt
          version = 0.1
          requirements = python3,kivy==2.3.0,requests,certifi
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.arch = armeabi-v7a
          android.accept_sdk_license = True
          p4a.branch = master
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOT

      - name: Sovereign Forge & Search
        run: |
          export PATH=$PATH:/home/runner/.local/bin
          # Force clean and build with absolute log capture
          buildozer clean
          yes | buildozer android debug 2>&1 | tee global_forge.log

      - name: Upload Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sovereign-Full-Trace
          path: |
            global_forge.log
            bin/*.apk
            .buildozer/android/platform/build-*/build/dists/*/bin/*.apk
