name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autonomic Environment Prep
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget python3-pip zlib1g-dev autoconf libtool pkg-config cmake libgstreamer1.0-dev

      - name: Recursive Build Engine
        id: build_step
        run: |
          pip install --upgrade pip buildozer "setuptools<70.0.0" wheel Cython
          
          build_logic() {
            echo "::group::Executing Build Strategy"
            if [ ! -f buildozer.spec ]; then buildozer init; fi
            # Injecting optimized parameters directly into the spec
            sed -i 's/android.arch = .*/android.arch = armeabi-v7a/' buildozer.spec
            yes | buildozer -v android debug
          }

          # The Autonomic Retry Loop (3 Attempts with escalating force)
          build_logic || (echo "Attempt 1 failed. Wiping cache and retrying..." && buildozer clobber && build_logic) || (echo "Attempt 2 failed. Scaling dependencies..." && sudo apt-get install -y libsdl2-dev && build_logic)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
