name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Syntax & Dependency Scout
        run: |
          echo "Checking Python Syntax..."
          python3 -m py_compile *.py || echo "SYNTAX_ERROR_DETECTED"
          
          echo "Scanning Imports..."
          grep -h "^import " *.py | sort | uniq
          grep -h "^from " *.py | sort | uniq
          
          echo "Listing Directory Structure..."
          ls -R
