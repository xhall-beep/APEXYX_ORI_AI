name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sovereign Core Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget zlib1g-dev autoconf libtool pkg-config cmake libstdc++6
          python3 -m pip install --user --upgrade "buildozer==1.5.0" "Cython<3.0" setuptools
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Auto-License & NDK Injection
        run: |
          # Pre-accept Android SDK licenses to prevent interactive hangs
          mkdir -p $HOME/.android
          touch $HOME/.android/repositories.cfg
          yes | sdkmanager --licenses || true
          
          # Force the specific NDK version Buildozer expects
          wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -q
          unzip -q android-ndk-r25b-linux.zip -d $HOME/
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r25b" >> $GITHUB_ENV

      - name: Atomic Spec Injection
        run: |
          cat << 'EOT' > buildozer.spec
          [app]
          title = Apexyx Soul
          package.name = apexyx_soul
          package.domain = org.montgomery
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,js,so,dex,conf,sh,txt
          version = 0.1
          requirements = python3,kivy==2.3.0,requests,certifi
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.arch = armeabi-v7a
          android.accept_sdk_license = True
          p4a.branch = master
          [buildozer]
          log_level = 2
          EOT

      - name: Sovereign Absolute Strike
        run: |
          export PATH=$PATH:/home/runner/.local/bin
          # Tell buildozer exactly where the NDK we just downloaded is
          export APP_ANDROID_NDK_PATH=$HOME/android-ndk-r25b
          buildozer android debug

      - name: Upload Sovereign APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Apexyx-Sovereign-APK
          path: bin/*.apk
