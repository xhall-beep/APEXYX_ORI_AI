name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sovereign Core Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget zlib1g-dev autoconf libtool pkg-config cmake libstdc++6 libncurses5
          python3 -m pip install --user --upgrade "buildozer==1.5.0" "Cython<3.0"
          echo "/home/runner/.local/bin" >> $GITHUB_PATH

      - name: Atomic Spec Injection
        run: |
          cat << 'EOT' > buildozer.spec
          [app]
          title = Apexyx Soul
          package.name = apexyx_soul
          package.domain = org.montgomery
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,js,so,dex,conf,sh,txt
          version = 0.1
          requirements = python3,kivy==2.3.0,requests,certifi
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.arch = armeabi-v7a
          android.accept_sdk_license = True
          p4a.branch = master
          [buildozer]
          log_level = 2
          EOT

      - name: Sovereign Artifact Strike
        run: |
          export PATH=$PATH:/home/runner/.local/bin
          # Force a clean directory for the SDK
          mkdir -p ~/.android && touch ~/.android/repositories.cfg
          # Accept licenses and build, pipe everything to a visible file
          yes | buildozer android debug 2>&1 | tee full_forge.log

      - name: Upload Logs on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Forge-Debug-Logs
          path: full_forge.log

      - name: Upload Sovereign APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Apexyx-Sovereign-APK
          path: bin/*.apk
