name: Apexyx Soul Forge
on:
  push:
    branches: [ sovereign-alignment ]
  workflow_dispatch:

jobs:
  forge:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Hard-Coded System Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk wget zlib1g-dev autoconf libtool pkg-config cmake aidl libstdc++6
          
          # Use pipx for isolated, globally accessible binaries
          sudo apt-get install -y pipx
          pipx ensurepath
          pipx install "buildozer==1.5.0"
          pipx runpip buildozer install "Cython<3.0" setuptools

      - name: Atomic Spec Injection
        run: |
          cat << 'EOT' > buildozer.spec
          [app]
          title = Apexyx Soul
          package.name = apexyx_soul
          package.domain = org.montgomery
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas,js,so,dex,conf,sh,txt
          version = 0.1
          requirements = python3,kivy==2.3.0,requests,certifi
          orientation = portrait
          android.api = 33
          android.minapi = 21
          android.ndk = 25b
          android.arch = armeabi-v7a
          android.accept_sdk_license = True
          p4a.branch = master
          [buildozer]
          log_level = 2
          EOT

      - name: Sovereign Strike
        run: |
          # Use pipx run to ensure the binary is found regardless of pathing
          pipx run buildozer android debug
        
      - name: Upload Sovereign APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Apexyx-Sovereign-APK
          path: bin/*.apk
